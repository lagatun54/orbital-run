x-build: &app-build
  context: .
  target: ${APP_TARGET:-local}
  args:
    GOPROXY: "${GO_MODULE_PROXY:-https://proxy.golang.org|direct}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbital}
      POSTGRES_DB: orbital
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital -d orbital"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.2
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - matches.finished
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy

  game:
    image: ${BACKEND_IMAGE:-orbital-run:local}
    build: *app-build
    environment:
      KAFKA_BROKERS: kafka:9092
      BOT_ADDRESS: bot:9001
      SCORES_URL: http://scores:8081
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:${GAME_PORT:-8080}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      bot:
        condition: service_started
      scores:
        condition: service_started
    restart: unless-stopped

  bot:
    image: ${BACKEND_IMAGE:-orbital-bot:local}
    build: *app-build
    command: ["bot"]
    restart: unless-stopped

  scores:
    image: ${BACKEND_IMAGE:-orbital-scores:local}
    build: *app-build
    command: ["scores"]
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: "host=postgres user=orbital password=${POSTGRES_PASSWORD:-orbital} dbname=orbital sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/leaderboard"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
