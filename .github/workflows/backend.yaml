name: Backend

on:
  pull_request:
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'config/**'
      - 'db/**'
      - 'deploy/render-relay/**'
      - 'render.yaml'
      - 'internal/**'
      - 'tests/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose*.yaml'
      - 'Caddyfile'
      - '.github/workflows/backend.yaml'
  push:
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'config/**'
      - 'db/**'
      - 'deploy/render-relay/**'
      - 'render.yaml'
      - 'internal/**'
      - 'tests/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose*.yaml'
      - 'Caddyfile'
      - '.github/workflows/backend.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_IMAGE: orbital-backend:ci
      FRONTEND_ORIGIN: https://frontend.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go modules and vet
        run: make check
      - name: Validate Render relay
        run: |
          docker build --tag orbital-render-relay:ci deploy/render-relay
          docker run --rm -e ORBITAL_API_ORIGIN=https://upstream.example.com orbital-render-relay:ci \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Unit tests
        run: go test -race ./api/... ./cmd/... ./config/... ./db/... ./internal/... ./tests/unit
      - name: Integration tests
        run: go test -race -count=1 ./tests/integration
      - name: End-to-end tests
        run: bash tests/e2e/run.sh

  publish:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: image
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repository%-backend}-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          target: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Report image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          echo "Backend image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-northflank:
    name: Deploy to Northflank
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    environment: backend
    steps:
      - name: Build and wait for the tested commit
        shell: bash
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_SERVICE_URL: https://api.northflank.com/v1/projects/default/services/orbital-run
        run: |
          : "${NORTHFLANK_API_TOKEN:?Set the backend environment secret NORTHFLANK_API_TOKEN}"
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN")
          payload=$(jq -nc --arg sha "$GITHUB_SHA" '{sha: $sha}')
          build_id=$(curl --fail --silent --show-error --max-time 30 "${auth[@]}" \
            -H 'Content-Type: application/json' -d "$payload" "$NORTHFLANK_SERVICE_URL/build" |
            jq -er '.data.id | select(type == "string" and test("^[a-z0-9-]+$"))')
          echo "Northflank build: $build_id"

          while true; do
            build=$(curl --fail --silent --show-error --retry 2 --max-time 30 "${auth[@]}" \
              "$NORTHFLANK_SERVICE_URL/build/$build_id")
            build_status=$(jq -er '.data.status' <<< "$build")
            echo "Build status: $build_status"
            case "$build_status" in
              SUCCESS) break ;;
              ABORTED|FAILURE|SUBMISSION_FAILURE|CRASHED)
                echo "::error::Northflank build ended with $build_status"
                exit 1
                ;;
            esac
            sleep 15
          done

          while true; do
            deployments=$(curl --fail --silent --show-error --retry 2 --max-time 30 "${auth[@]}" \
              "$NORTHFLANK_SERVICE_URL/deployments?per_page=5")
            if jq -e --arg sha "$GITHUB_SHA" \
              'any(.data.deployments[]; .active and .commit.sha == $sha)' <<< "$deployments" > /dev/null; then
              echo "Northflank is serving commit $GITHUB_SHA"
              break
            fi
            sleep 15
          done

  deploy:
    name: Deploy over SSH (optional)
    if: vars.DEPLOY_BACKEND == 'true' && github.ref_name == github.event.repository.default_branch
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: backend
    env:
      SSH_HOST: ${{ vars.BACKEND_SSH_HOST }}
      SSH_USER: ${{ vars.BACKEND_SSH_USER }}
      SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
      IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy image to backend host
        run: |
          : "${SSH_HOST:?}" "${SSH_USER:?}" "${SSH_KEY:?}" "${SSH_KNOWN_HOSTS:?}"
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
          tar -cf - compose.yaml compose.public.yaml Caddyfile | ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "
            set -eu
            cd orbital-backend
            test -s .env
            tar -xf -
            BACKEND_IMAGE='$IMAGE' docker compose -f compose.yaml -f compose.public.yaml up --detach --no-build --pull always --wait --wait-timeout 120
            BACKEND_IMAGE='$IMAGE' docker compose -f compose.yaml -f compose.public.yaml exec -T caddy caddy reload --config - --adapter caddyfile < Caddyfile
          "
