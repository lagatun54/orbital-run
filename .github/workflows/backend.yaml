name: Backend

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose*.yaml'
      - 'Caddyfile'
      - '.github/workflows/backend.yaml'
  push:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose*.yaml'
      - 'Caddyfile'
      - '.github/workflows/backend.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_IMAGE: orbital-backend:ci
      FRONTEND_ORIGIN: https://frontend.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: docker build --target backend --tag "$BACKEND_IMAGE" .
      - run: docker compose up --no-build --detach --wait --wait-timeout 90
      - name: Check backend API and frontend origin
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8080/healthz
          curl -fsS -D - -o /dev/null -H "Origin: $FRONTEND_ORIGIN" http://127.0.0.1:8080/api/leaderboard \
            | tr -d '\r' | grep -Fxi "Access-Control-Allow-Origin: $FRONTEND_ORIGIN"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 404
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  publish:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          target: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Report image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          echo "Backend image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: vars.DEPLOY_BACKEND == 'true' && github.ref_name == github.event.repository.default_branch
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: backend
    env:
      SSH_HOST: ${{ vars.BACKEND_SSH_HOST }}
      SSH_USER: ${{ vars.BACKEND_SSH_USER }}
      SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
      IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy image to backend host
        run: |
          : "${SSH_HOST:?}" "${SSH_USER:?}" "${SSH_KEY:?}" "${SSH_KNOWN_HOSTS:?}"
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
          tar -cf - compose.yaml compose.public.yaml Caddyfile | ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "
            set -eu
            cd orbital-backend
            test -s .env
            tar -xf -
            BACKEND_IMAGE='$IMAGE' docker compose -f compose.yaml -f compose.public.yaml up --detach --no-build --pull always --wait --wait-timeout 120
          "
