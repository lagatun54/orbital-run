syntax = "proto3";

package orbital.scores.v1;

import "scores/v1/match_result.proto";

option go_package = "orbitalrun/api/scores/v1;scoresv1";

service ResultsService {
  rpc GetResult(GetResultRequest) returns (GetResultResponse);
  rpc SaveLocalResult(SaveLocalResultRequest) returns (SaveLocalResultResponse);
}

message GetResultRequest {
  string id = 1;
}

message GetResultResponse {
  MatchResult result = 1;
  int64 rank = 2;
}

message SaveLocalResultRequest {
  string id = 1;
  string name = 2;
  optional int32 score = 3;
  optional int32 bot_score = 4;
}

message SaveLocalResultResponse {}
